name: Update games data

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}       # lets you press "Run workflow" by hand
  push:
    paths: ["scripts/**", "site.config.json"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build data/games.json from Notion + PlayStation Store
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/build-data.mjs
      - name: Commit updated data
        run: |
          git config user.name "hexa-bot"
          git config user.email "hexa-bot@users.noreply.github.com"
          git add data/games.json data/meta.json
          git diff --cached --quiet || git commit -m "update games data"
          git push
